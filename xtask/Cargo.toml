[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
description = "i3s spec toolchain: parse markdown spec to JSON Schema, generate Rust types"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
heck = "0.5"
proc-macro2 = "1"
quote = "1"
schemagen = { git = "https://github.com/calebbuffa/schemagen.git" }
syn = { version = "2", features = ["parsing"] }
