[workspace]
members = ["xtask"]

[package]
name = "i3s"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/calebbuffa/i3s"
edition = "2024"
description = "I3S (Indexed 3D Scene Layer) specification"

[features]
strict = []

[dependencies]
kiba = { git = "https://github.com/calebbuffa/kiba" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
